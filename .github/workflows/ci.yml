# The same three-job law as every other ShipStatic npm repo — the version picks
# the channel, the branch grants the right to use it. See root CLAUDE.md,
# "The npm publish law".
#
# This repo is main-only (no `development`): a forwarder for a stable line
# publishes to `latest` and has nothing to stage on a beta channel.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No `version:` — pnpm/action-setup reads `packageManager`, so the pin
      # lives in exactly one place.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # There is no build step. This package is hand-written forwarding, which
      # is why publint and attw below run against exactly what ships.
      - run: pnpm test:ci

      - run: pnpm check:package

  # The publish decision is its own job because `publish`'s `environment:` is
  # evaluated before any step runs — it can only read another job's outputs.
  version:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: decide
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          # The VERSION decides the channel: a prerelease (any `-` suffix) goes to
          # `beta`, so `latest` keeps resolving the last stable release.
          if [[ "$VERSION" == *-* ]]; then TAG=beta; else TAG=latest; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # The BRANCH decides whether that channel may be published from here.
          if [[ "$TAG" == "latest" && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::notice title=Release staged::$NAME@$VERSION is a stable version. latest publishes only from main, so nothing was published from $GITHUB_REF_NAME."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Idempotence: once the version is on the registry, any push is a no-op.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on the registry — nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `npm-latest` carries a main-only deployment branch policy, so publishing
    # `latest` off `main` is refused by GitHub before a step runs.
    environment: npm-${{ needs.version.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No `registry-url`: it would write an `_authToken` line into .npmrc, and
      # npm reads that line — even with no token — as "token auth is configured"
      # and skips the OIDC handshake (actions/setup-node#1551).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # OIDC needs npm >= 11.5.1; node 22 bundles 10.x, and pnpm has no OIDC
      # support — hence `npm`, not `pnpm`, for the publish.
      - run: npm install -g npm@latest

      # Trusted publishing: no NODE_AUTH_TOKEN anywhere in this job — npm
      # authenticates with a token whenever one is present and attempts OIDC
      # only in its absence.
      - run: npm publish --access public --provenance --tag "${{ needs.version.outputs.tag }}"

      - uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ shipstatic-cli ${{ needs.version.outputs.version }} published (${{ needs.version.outputs.tag }})"

      - if: failure()
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🔴 shipstatic-cli publish failed"
